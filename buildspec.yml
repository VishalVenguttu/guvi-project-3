version: 0.2

env:
  variables:
    ECR_REPO: brain-tasks-app

phases:
  install:
    commands:
      - curl -sLO https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
      - chmod +x kubectl && mv kubectl /usr/local/bin/
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY
      - TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
  build:
    commands:
      - docker build -t $REGISTRY/$ECR_REPO:$TAG -t $REGISTRY/$ECR_REPO:latest .
  post_build:
    commands:
      - docker push $REGISTRY/$ECR_REPO:$TAG
      - docker push $REGISTRY/$ECR_REPO:latest
      - sed -i "s|IMAGE_PLACEHOLDER|$REGISTRY/$ECR_REPO:$TAG|" k8s/deployment.yaml
      # Deploy directly from CodeBuild (remove these 4 lines if you use the EKS deploy action in step 11):
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $CLUSTER_NAME
      - kubectl apply -f k8s/
      - kubectl rollout status deployment/brain-tasks-app --timeout=180s
      - kubectl get svc brain-tasks-svc

artifacts:
  files:
    - k8s/*.yaml
